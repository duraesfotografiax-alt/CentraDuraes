<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0B0A">
<meta name="robots" content="noindex">
<title>Escolha das fotos · Durães Fotografia</title>
<link rel="icon" href="logos/duraes.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Galeria de seleção para o cliente: escura e quente, para as fotos aparecerem; laranja da Durães marca o que foi escolhido. */
:root{
  color-scheme:dark;
  --bg:#0C0B0A; --panel:#161412; --panel2:#1E1B18; --line:#2C2824; --ink:#F4EFE8; --muted:#A39A90; --faint:#6E665E;
  --sel:#FF6A1F; --sel-bg:rgba(255,106,31,.16); --ok:#3DD68C;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px}
header.top{padding-block:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
header.top img{height:64px;width:auto}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5vw,48px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.msg{max-width:620px;color:var(--muted);line-height:1.55;margin:0;font-size:15px}
.rules{font-size:13px;color:var(--faint)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(12,11,10,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:10px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.count b{color:var(--sel)}
.saved{font-size:12px;color:var(--faint);white-space:nowrap}
.grid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));padding-block:14px 120px}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}}
.ph{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--panel);overflow:hidden;cursor:zoom-in;border-radius:4px}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s,opacity .3s;opacity:0}
.ph img.ok{opacity:1}
.ph:hover img{transform:scale(1.03)}
.ph .pick{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ph .pick svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;opacity:.9}
.ph.on{box-shadow:inset 0 0 0 3px var(--sel)}
.ph.on .pick{background:var(--sel);border-color:var(--sel)}
.ph.on .pick svg{fill:#fff;stroke:#fff}
@media (max-width:520px){.ph .pick{width:28px;height:28px;right:4px;bottom:4px}.ph .pick svg{width:15px;height:15px}}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(22,20,18,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.foot .t{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.foot .t b{color:var(--ink);font-size:17px}
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--sel);transition:width .25s}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:11px 20px;font-weight:800;font-size:14px}
.btn.primary{background:var(--sel);border-color:var(--sel);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none}
/* visualizador */
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,5,5,.97);display:flex;flex-direction:column}
.lb .tb{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:var(--muted);font-size:13px}
.lb .tb .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.08);font-size:26px;line-height:1}
.lb .nav.p{left:12px}.lb .nav.n{right:12px}
@media (max-width:640px){.lb .nav{display:none}}
.lb .bb{display:flex;justify-content:center;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.lb .bb .btn.on{background:var(--sel);border-color:var(--sel);color:#fff}
/* revisão */
.sheet{position:fixed;inset:0;z-index:25;background:rgba(5,5,5,.75);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--serif);font-size:30px;margin:0;font-weight:600}
.mini{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:40vh;overflow-y:auto}
.mini img{width:100%;aspect-ratio:1/1;max-width:100%;object-fit:cover;border-radius:4px;background:var(--panel2)}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;min-height:80px;resize:vertical}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px}
.center p{color:var(--muted);max-width:480px;line-height:1.55;margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sel)}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
</style>
</head>
<body>
<div id="root"><div class="center"><div class="spin" aria-label="Carregando"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20261007"></script>
<script>
(function(){
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const root=document.getElementById('root');
const id=new URLSearchParams(location.search).get('a')||'';
let A=null,sel=new Set(),grupo='todas',soEsc=false,lbIdx=-1,lista=[],salvarT=null,salvando=false,pendente=false,travado=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const th=(fid,w)=>'https://drive.google.com/thumbnail?id='+fid+'&sz=w'+w;
const th2=(fid,w)=>'https://lh3.googleusercontent.com/d/'+fid+'=w'+w;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function dataBR(s){if(!s)return '';const [y,m,d]=s.slice(0,10).split('-');return d+'/'+m+'/'+y}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function agoraLocal(){const d=new Date();return hojeISO()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function lim(){return A&&A.limite||0}
function erro(t,s){root.innerHTML='<div class="center"><img src="logos/duraes.png" alt="Durães Fotografia" style="height:70px"><h1 style="font-size:32px">'+esc(t)+'</h1><p>'+esc(s||'')+'</p></div>'}

if(!id||!self.FIREBASE_CONFIG){erro('Link incompleto','Confira se você abriu o link inteiro que a Durães Fotografia enviou.');return}
firebase.initializeApp(self.FIREBASE_CONFIG);
const db=firebase.firestore();const ref=db.collection('albuns').doc(id);
let primeiro=true;
ref.onSnapshot(d=>{
  if(!d.exists){erro('Álbum não encontrado','Este link não existe mais. Fale com a Durães Fotografia.');return}
  const novo=d.data();A=novo;
  if(primeiro||!salvando&&!pendente){sel=new Set((novo.selecionadas||[]).filter(x=>(novo.fotos||[]).some(f=>f.id===x)))}
  travado=novo.status!=='aberto'||(novo.prazo&&novo.prazo<hojeISO());
  if(primeiro){primeiro=false;montar()}else atualizar();
},()=>erro('Não consegui abrir o álbum','Confira sua internet e recarregue a página.'));

function grupos(){const g=[...new Set((A.fotos||[]).map(f=>f.g||''))];return g.filter(x=>x).length?g:[]}
function filtradas(){let fs=A.fotos||[];if(grupo!=='todas')fs=fs.filter(f=>(f.g||'')===grupo);if(soEsc)fs=fs.filter(f=>sel.has(f.id));return fs}

function montar(){
  const env=A.status!=='aberto',venc=!env&&A.prazo&&A.prazo<hojeISO();
  root.innerHTML='<header class="top wrap"><img src="logos/duraes.png" alt="Durães Fotografia"><h1>'+esc(A.titulo)+'</h1>'+
    (env?'<p class="msg">Seleção enviada'+(A.enviadoEm?' em '+dataBR(A.enviadoEm):'')+'. Obrigado! Abaixo estão as fotos que vocês escolheram.</p>':venc?'<p class="msg">O prazo para escolher terminou em '+dataBR(A.prazo)+'. Fale com a Durães Fotografia para reabrir.</p>':(A.msg?'<p class="msg">'+esc(A.msg)+'</p>':'<p class="msg">Toque no coração para escolher as fotos do seu álbum. Para ver uma foto grande, toque nela.</p>'))+
    (!env&&!venc?'<span class="rules">'+(lim()?'Escolha até '+lim()+' fotos':'Escolha quantas quiser')+(A.prazo?' · prazo até '+dataBR(A.prazo):'')+' · sua escolha fica salva automaticamente</span>':'')+'</header>'+
    '<div class="bar"><div class="wrap"><div class="chips" id="chips"></div><span class="saved" id="saved"></span></div></div>'+
    '<main class="wrap"><div class="grid" id="grid"></div></main>'+
    (env||venc?'':'<div class="foot"><div class="in"><div class="t"><span id="ct"></span><div class="meter"><i id="mt"></i></div></div><button class="btn primary" id="rev">Revisar e enviar</button></div></div>');
  const rv=document.getElementById('rev');if(rv)rv.onclick=revisar;
  if(env){soEsc=true}
  atualizar();
}
function chips(){const gs=grupos(),c=document.getElementById('chips');if(!c)return;
  const b=(k,t,on)=>'<button data-g="'+esc(k)+'" aria-pressed="'+on+'">'+esc(t)+'</button>';
  c.innerHTML=b('todas','Todas ('+(A.fotos||[]).length+')',grupo==='todas'&&!soEsc)+gs.map(g=>b(g,g||'Outras',grupo===g&&!soEsc)).join('')+b('__esc','Escolhidas ('+sel.size+')',soEsc);
  c.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{if(x.dataset.g==='__esc'){soEsc=true;grupo='todas'}else{soEsc=false;grupo=x.dataset.g}grade()})}
function grade(){lista=filtradas();chips();const g=document.getElementById('grid');
  g.innerHTML=lista.length?lista.map((f,i)=>'<div class="ph'+(sel.has(f.id)?' on':'')+'" data-i="'+i+'"><img data-src="'+f.id+'" alt="'+esc(f.n)+'" loading="lazy" referrerpolicy="no-referrer">'+(travado?'':'<button class="pick" aria-label="Escolher foto" data-p="'+f.id+'">'+HEART+'</button>')+'</div>').join(''):'<div class="center" style="grid-column:1/-1;min-height:30vh"><p>'+(soEsc?'Nenhuma foto escolhida ainda. Toque no coração das fotos que vocês querem no álbum.':'Nenhuma foto aqui.')+'</p></div>';
  g.querySelectorAll('img[data-src]').forEach(im=>{const fid=im.dataset.src;im.onload=()=>im.classList.add('ok');im.onerror=()=>{if(!im.dataset.f){im.dataset.f=1;im.src=th2(fid,500)}};im.src=th(fid,500)});
}
function contador(){const ct=document.getElementById('ct'),mt=document.getElementById('mt');
  if(ct)ct.innerHTML='<b>'+sel.size+'</b>'+(lim()?' de '+lim():'')+' fotos escolhidas';
  if(mt)mt.style.width=(lim()?Math.min(100,sel.size/lim()*100):Math.min(100,sel.size))+'%';
  const rv=document.getElementById('rev');if(rv)rv.disabled=!sel.size}
function atualizar(){if(!document.getElementById('grid'))return montar();grade();contador()}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-p]');if(p){e.stopPropagation();alternar(p.dataset.p);return}
  const ph=e.target.closest('.ph');if(ph){abrir(+ph.dataset.i)}
});
function alternar(fid){if(travado)return;
  if(sel.has(fid))sel.delete(fid);
  else{if(lim()&&sel.size>=lim()){toast('Vocês já escolheram '+lim()+' fotos. Desmarque uma para trocar.');return}sel.add(fid)}
  document.querySelectorAll('[data-p="'+fid+'"]').forEach(b=>b.closest('.ph').classList.toggle('on',sel.has(fid)));
  if(soEsc&&!sel.has(fid))grade();else chips();
  contador();lbBotao();agendarSalvar()}
function agendarSalvar(){pendente=true;const s=document.getElementById('saved');if(s)s.textContent='Salvando…';clearTimeout(salvarT);salvarT=setTimeout(salvar,900)}
async function salvar(){if(salvando){salvarT=setTimeout(salvar,500);return}salvando=true;pendente=false;
  try{await ref.update({selecionadas:[...sel],atualizadoEm:agoraLocal()});const s=document.getElementById('saved');if(s)s.textContent='Salvo ✓'}
  catch(e){const s=document.getElementById('saved');if(s)s.textContent='Não salvou. Verifique a internet.';pendente=true}
  finally{salvando=false}}
window.addEventListener('beforeunload',e=>{if(pendente){salvar();e.preventDefault();e.returnValue=''}});
// visualizador grande
function abrir(i){lbIdx=i;let lb=document.getElementById('lb');
  if(!lb){lb=document.createElement('div');lb.className='lb';lb.id='lb';lb.innerHTML='<div class="tb"><span class="n" id="lbN"></span><button class="btn ghost" id="lbX" aria-label="Fechar">Fechar</button></div><div class="stage" id="lbS"><img id="lbI" alt=""><button class="nav p" id="lbP" aria-label="Anterior">‹</button><button class="nav n" id="lbNx" aria-label="Próxima">›</button></div><div class="bb"><button class="btn" id="lbSel"></button></div>';document.body.appendChild(lb);
    lb.querySelector('#lbX').onclick=fechar;lb.querySelector('#lbP').onclick=()=>mover(-1);lb.querySelector('#lbNx').onclick=()=>mover(1);
    lb.querySelector('#lbSel').onclick=()=>alternar(lista[lbIdx].id);
    let x0=null;const st=lb.querySelector('#lbS');st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});st.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)mover(dx<0?1:-1);x0=null})}
  lb.hidden=false;document.body.style.overflow='hidden';mostrar()}
function mostrar(){const f=lista[lbIdx];if(!f)return;const im=document.getElementById('lbI');im.onerror=()=>{if(!im.dataset.f){im.dataset.f=1;im.src=th2(f.id,1600)}};im.dataset.f='';im.src=th(f.id,1600);
  document.getElementById('lbN').textContent=(lbIdx+1)+' de '+lista.length+' · '+f.n;
  [lbIdx+1,lbIdx-1].forEach(j=>{if(lista[j]){const p=new Image();p.referrerPolicy='no-referrer';p.src=th(lista[j].id,1600)}});lbBotao()}
function lbBotao(){const b=document.getElementById('lbSel');if(!b||lbIdx<0||!lista[lbIdx])return;const on=sel.has(lista[lbIdx].id);b.hidden=travado;b.classList.toggle('on',on);b.textContent=on?'♥ Escolhida · tocar para tirar':'♡ Escolher esta foto'}
function mover(d){if(!lista.length)return;lbIdx=(lbIdx+d+lista.length)%lista.length;mostrar()}
function fechar(){const lb=document.getElementById('lb');if(lb)lb.hidden=true;document.body.style.overflow='';lbIdx=-1}
document.addEventListener('keydown',e=>{const lb=document.getElementById('lb');if(!lb||lb.hidden)return;if(e.key==='ArrowRight')mover(1);else if(e.key==='ArrowLeft')mover(-1);else if(e.key==='Escape')fechar();else if(e.key===' '){e.preventDefault();if(!travado)alternar(lista[lbIdx].id)}});
// revisão e envio
function revisar(){const mapa=Object.fromEntries((A.fotos||[]).map(f=>[f.id,f])),fs=[...sel].map(x=>mapa[x]).filter(Boolean);
  const falta=lim()?lim()-sel.size:0;
  const sh=document.createElement('div');sh.className='sheet';sh.innerHTML='<div class="card"><h2>Enviar a seleção</h2><p style="margin:0;color:var(--muted)">Vocês escolheram <b style="color:var(--ink)">'+fs.length+' fotos</b>'+(falta>0?'. Ainda dá para escolher mais '+falta+'.':'.')+' Depois de enviar, a seleção vai para a Durães Fotografia montar o álbum e não dá mais para mudar por aqui.</p>'+
    '<div class="mini">'+fs.map(f=>'<img src="'+th(f.id,200)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\''+th2(f.id,200)+'\'">').join('')+'</div>'+
    '<label for="obs" style="font-size:13px;font-weight:700;color:var(--muted)">Recado para o fotógrafo (opcional)</label><textarea id="obs" maxlength="1000" placeholder="Ex.: a foto da entrada da noiva pode ser a capa"></textarea>'+
    '<div class="acts"><button class="btn ghost" id="cx">Voltar e continuar escolhendo</button><button class="btn primary" id="ok">Enviar seleção</button></div></div>';
  document.body.appendChild(sh);
  sh.querySelector('#cx').onclick=()=>sh.remove();sh.onclick=e=>{if(e.target===sh)sh.remove()};
  sh.querySelector('#ok').onclick=async()=>{const b=sh.querySelector('#ok');b.disabled=true;b.textContent='Enviando…';clearTimeout(salvarT);
    try{await ref.update({selecionadas:[...sel],obs:sh.querySelector('#obs').value.trim().slice(0,1000),status:'enviado',enviadoEm:agoraLocal(),atualizadoEm:agoraLocal()});pendente=false;sh.remove();
      root.innerHTML='<div class="center"><img src="logos/duraes.png" alt="Durães Fotografia" style="height:80px"><h1>Seleção enviada!</h1><p>Recebemos as '+fs.length+' fotos que vocês escolheram. Agora é com a gente: vamos montar o álbum e avisar vocês. Obrigado!</p></div>'}
    catch(e){b.disabled=false;b.textContent='Enviar seleção';toast('Não consegui enviar. Verifique a internet e tente de novo.')}};
}
})();
</script>
</body>
</html>
