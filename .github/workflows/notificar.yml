name: Notificações da Central

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      modo:
        description: 'teste = notificação de teste; auto = roda normal; meta = atualiza o tráfego pago agora'
        default: 'teste'
        type: choice
        options: [teste, auto, meta]

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix notificar --no-audit --no-fund
      - run: node notificar/index.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://duraesfotografiax-alt.github.io/CentraDuraes/
          ADMIN_EMAIL: duraesfotografiax@gmail.com
          MODO: ${{ github.event.inputs.modo || 'auto' }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
